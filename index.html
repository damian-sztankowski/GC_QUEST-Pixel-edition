
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Cloud Quest: Pixel Escape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --g-blue: #4285F4;
            --g-red: #EA4335;
            --g-yellow: #FBBC05;
            --g-green: #34A853;
            --pixel-size: 4px;
        }
        body {
            font-family: 'VT323', monospace;
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
            image-rendering: pixelated;
            scroll-behavior: smooth;
            height: 100vh;
        }
        .pixel-font {
            font-family: 'Press Start 2P', cursive;
            line-height: 1.5;
        }
        .mono-font {
            font-family: 'VT323', monospace;
        }

        /* Retro CRT Effect */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* Glitch Animation for Easter Egg */
        .system-wipe-glitch {
            animation: glitch-shake 0.1s infinite;
            filter: contrast(2) brightness(1.5) hue-rotate(90deg);
        }

        @keyframes glitch-shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, 5px); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0, 0); }
        }

        /* CRT Shutdown Animation */
        .crt-shutdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 5000;
            animation: crt-off 1.2s forwards cubic-bezier(0.19, 1, 0.22, 1);
        }

        @keyframes crt-off {
            0% {
                transform: scale(1, 1);
                opacity: 1;
            }
            30% {
                transform: scale(1, 0.005);
                opacity: 1;
            }
            60% {
                transform: scale(0.005, 0.005);
                opacity: 1;
            }
            100% {
                transform: scale(0, 0);
                opacity: 0;
            }
        }

        .crt-overlay::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(255, 255, 255, 0) 45%,
                rgba(255, 255, 255, 0.04) 50%,
                rgba(255, 255, 255, 0) 55%,
                transparent 100%
            );
            background-size: 100% 200%;
            animation: rolling-bar 8s linear infinite;
            pointer-events: none;
        }

        @keyframes rolling-bar {
            0% { background-position: 0 -100%; }
            100% { background-position: 0 100%; }
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 16, 16, 0.03);
            pointer-events: none;
            z-index: 999;
        }

        @keyframes flicker {
            0% { opacity: 0.27; }
            50% { opacity: 0.32; }
            100% { opacity: 0.27; }
        }

        .pixel-box {
            background: #1a1a1a;
            border: var(--pixel-size) solid #fff;
            box-shadow: 
                inset calc(var(--pixel-size) * -1) calc(var(--pixel-size) * -1) 0px #000,
                inset var(--pixel-size) var(--pixel-size) 0px #555,
                8px 8px 0px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .pixel-button {
            background: #333;
            border: var(--pixel-size) solid #fff;
            box-shadow: 
                inset calc(var(--pixel-size) * -1) calc(var(--pixel-size) * -1) 0px #000,
                inset var(--pixel-size) var(--pixel-size) 0px #777,
                6px 6px 0px #000;
            transition: all 0.05s steps(2);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .pixel-button:hover {
            background: #444;
            transform: translate(2px, 2px);
            box-shadow: 
                inset calc(var(--pixel-size) * -1) calc(var(--pixel-size) * -1) 0px #000,
                inset var(--pixel-size) var(--pixel-size) 0px #888,
                4px 4px 0px #000;
        }

        .pixel-button-primary {
            background: #4285F4;
            border-color: #fff;
            color: #fff;
            box-shadow: 
                inset -4px -4px 0px #0044aa, 
                inset 4px 4px 0px #88ccff, 
                6px 6px 0px #000;
        }

        @keyframes float-pixel {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-pixel-float {
            animation: float-pixel 2.5s steps(4) infinite;
        }

        .pixel-grid {
            background-image: 
                linear-gradient(to right, #ffffff0a 2px, transparent 2px),
                linear-gradient(to bottom, #ffffff0a 2px, transparent 2px);
            background-size: 32px 32px;
        }

        .scanline-move {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.05), transparent);
            pointer-events: none;
            z-index: 1001;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { top: -100px; }
            100% { top: 100%; }
        }

        .pixel-progress-container {
            height: 24px;
            background: #000;
            border: 4px solid #fff;
            position: relative;
        }
        .pixel-progress-bar {
            height: 100%;
            background: #34A853;
            box-shadow: inset -4px -4px 0px #1a5e20, inset 4px 4px 0px #81c784;
            transition: width 0.3s steps(8);
        }

        .pixel-hr {
            border: none;
            height: 8px;
            background: repeating-linear-gradient(90deg, #fff 0px, #fff 8px, transparent 8px, transparent 16px);
            margin: 2rem 0;
        }

        .blinking {
            animation: blink 0.5s steps(2) infinite;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* CRT Monitor Simulation */
        .monitor-bezel {
            border: 32px solid #222;
            border-radius: 12px;
            box-shadow: 
                0 0 0 4px #444,
                0 0 50px rgba(0,0,0,0.9);
            position: relative;
        }
        
        @media (min-width: 1440px) {
            .monitor-bezel::after {
                content: "BIT_CORE_X1";
                position: absolute;
                bottom: -28px;
                right: 20px;
                font-family: 'Press Start 2P', cursive;
                font-size: 8px;
                color: #555;
            }
        }

        /* Specialized Title Styling from Screenshot */
        .title-container {
            border: 4px dashed #4285F4;
            padding: 2.5rem 4rem;
            position: relative;
            background-color: rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }

        .pixel-cloud-escape-text {
            color: #ffffff;
            text-shadow: 
                6px 6px 0px #4285F4,
                -1px -1px 0px #4285F4,
                1px -1px 0px #4285F4,
                -1px 1px 0px #4285F4,
                1px 1px 0px #4285F4;
            letter-spacing: -2px;
            line-height: 1.1;
        }

        .bit-challenge-banner {
            position: relative;
            display: inline-block;
            background: linear-gradient(rgba(251, 188, 5, 0.1) 50%, transparent 50%);
            background-size: 100% 4px;
            border-top: 3px solid #FBBC05;
            border-bottom: 3px solid #FBBC05;
            padding: 0.75rem 3rem;
            box-shadow: 0 0 15px rgba(251, 188, 5, 0.3);
        }

        .bit-challenge-text {
            color: #FBBC05;
            letter-spacing: 0.3em;
            text-shadow: 0 0 5px rgba(251, 188, 5, 0.8);
        }

        #root {
            height: 100%;
        }

        /* Global Beacon Keyframes */
        @keyframes sonar-ping {
          0% { transform: scale(0.1); opacity: 1; border-width: 8px; }
          100% { transform: scale(2); opacity: 0; border-width: 1px; }
        }

        .animate-sonar {
          animation: sonar-ping 2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes typewriter {
          from { width: 0; }
          to { width: 100%; }
        }

        .typewriter-effect {
          display: inline-block;
          overflow: hidden;
          white-space: nowrap;
          border-right: 4px solid #fff;
          animation: typewriter 2s steps(40) forwards, blink 0.5s step-end infinite alternate;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div class="crt-overlay"></div>
    <div class="crt-flicker"></div>
    <div id="root"></div>
</body>
</html>
